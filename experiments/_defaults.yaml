# Merged under every experiment file; experiments override any key.
harness: opencode
# custom: our role prompt replaces OpenCode's system prompt; vendor: OpenCode's default prompt + our role.
prompts: custom
# Context budget per role; a model shared by several roles gets the largest of their budgets.
context:
  explorer: 32768
  coder: 65536
  reviewer: 65536
  debugger: 131072
  escalation: 131072
# DeepSeek Harness has no per-role limit; these sit above its observed maximum so both harnesses get the same budget.
steps:
  explorer: 40
  coder: 150
  reviewer: 50
  debugger: 150
  escalation: 150
policy:
  coder_retries: 2
  debugger_attempts: 1
  escalation_attempts: 0
  infra_retries: 2
