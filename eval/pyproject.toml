[project]
name = "nightshift-eval"
version = "0.0.0"
description = "Task mining, evaluation and optimization glue for nightshift"
requires-python = ">=3.14"
dependencies = [
    "harbor==0.24.0",
]

[project.scripts]
nightshift-eval = "nightshift_eval.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
