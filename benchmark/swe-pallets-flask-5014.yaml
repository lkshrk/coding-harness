  +++ b/src/flask/blueprints.py\n@@ -190,6 +190,9 @@ def __init__(\n             root_path=root_path,\n        \
  \ )\n \n+        if not name:\n+            raise ValueError(\"'name' may not be empty.\")\n+\n         if \"\
  .\" in name:\n             raise ValueError(\"'name' may not contain a dot '.' character.\")\n \n"
