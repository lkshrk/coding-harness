[project]
name = "coding-harness"
version = "0.1.0"
description = "Evaluate coding-agent harnesses and model hierarchies on real repository tasks"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-client>=3.5,<4",
    "certifi",
    "openinference-semantic-conventions>=0.1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pyyaml>=6",
    "zstandard>=0.23",
]

[project.optional-dependencies]
swebench = ["swebench>=4,<5"]

[project.scripts]
harness = "coding_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_harness"]

[tool.ruff]
line-length = 110
